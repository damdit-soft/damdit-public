# .github/workflows/damdit.yml: audits the websites in damdit.yml and fails only on what is new.
# The cache keeps each website's last run, which is the baseline of the next one.
name: Damdit
on:
  schedule: [{ cron: "0 6 * * 1" }] # every Monday at 06:00 UTC
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: damdit-state
          key: damdit-${{ github.run_id }}
          restore-keys: damdit-
      - run: docker run --rm -e DAMDIT_CI_KEY -v "$PWD:/work" damdit/damdit:27 ci run
        env:
          DAMDIT_CI_KEY: ${{ secrets.DAMDIT_CI_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: damdit-reports
          path: damdit-state/*/reports/
